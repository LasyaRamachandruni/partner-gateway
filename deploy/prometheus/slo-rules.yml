# Generated by `python -m pgw.obs.slo` from pgw/obs/slo.py. Do not edit by hand.
groups:
- name: partner-gateway-slo-recording
  rules:
  - record: pgw:slo_availability_error_ratio:rate5m
    expr: sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token",status=~"5.."}[5m])) / sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token"}[5m]))
  - record: pgw:slo_availability_error_ratio:rate30m
    expr: sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token",status=~"5.."}[30m])) / sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token"}[30m]))
  - record: pgw:slo_availability_error_ratio:rate1h
    expr: sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token",status=~"5.."}[1h])) / sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token"}[1h]))
  - record: pgw:slo_availability_error_ratio:rate6h
    expr: sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token",status=~"5.."}[6h])) / sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token"}[6h]))
  - record: pgw:slo_availability_error_ratio:rate3d
    expr: sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token",status=~"5.."}[3d])) / sum(rate(pgw_http_requests_total{route=~"/v1/.*|/oauth/token"}[3d]))
  - record: pgw:slo_latency_error_ratio:rate5m
    expr: 1 - sum(rate(pgw_http_request_duration_seconds_bucket{route="/v1/vehicles/{vin}",method="GET",le="0.3"}[5m])) / sum(rate(pgw_http_request_duration_seconds_count{route="/v1/vehicles/{vin}",method="GET"}[5m]))
  - record: pgw:slo_latency_error_ratio:rate30m
    expr: 1 - sum(rate(pgw_http_request_duration_seconds_bucket{route="/v1/vehicles/{vin}",method="GET",le="0.3"}[30m])) / sum(rate(pgw_http_request_duration_seconds_count{route="/v1/vehicles/{vin}",method="GET"}[30m]))
  - record: pgw:slo_latency_error_ratio:rate1h
    expr: 1 - sum(rate(pgw_http_request_duration_seconds_bucket{route="/v1/vehicles/{vin}",method="GET",le="0.3"}[1h])) / sum(rate(pgw_http_request_duration_seconds_count{route="/v1/vehicles/{vin}",method="GET"}[1h]))
  - record: pgw:slo_latency_error_ratio:rate6h
    expr: 1 - sum(rate(pgw_http_request_duration_seconds_bucket{route="/v1/vehicles/{vin}",method="GET",le="0.3"}[6h])) / sum(rate(pgw_http_request_duration_seconds_count{route="/v1/vehicles/{vin}",method="GET"}[6h]))
  - record: pgw:slo_latency_error_ratio:rate3d
    expr: 1 - sum(rate(pgw_http_request_duration_seconds_bucket{route="/v1/vehicles/{vin}",method="GET",le="0.3"}[3d])) / sum(rate(pgw_http_request_duration_seconds_count{route="/v1/vehicles/{vin}",method="GET"}[3d]))
  - record: pgw:slo_command_error_ratio:rate5m
    expr: 1 - sum(rate(pgw_command_completion_seconds_bucket{le="60"}[5m])) / sum(rate(pgw_command_completion_seconds_count[5m]))
  - record: pgw:slo_command_error_ratio:rate30m
    expr: 1 - sum(rate(pgw_command_completion_seconds_bucket{le="60"}[30m])) / sum(rate(pgw_command_completion_seconds_count[30m]))
  - record: pgw:slo_command_error_ratio:rate1h
    expr: 1 - sum(rate(pgw_command_completion_seconds_bucket{le="60"}[1h])) / sum(rate(pgw_command_completion_seconds_count[1h]))
  - record: pgw:slo_command_error_ratio:rate6h
    expr: 1 - sum(rate(pgw_command_completion_seconds_bucket{le="60"}[6h])) / sum(rate(pgw_command_completion_seconds_count[6h]))
  - record: pgw:slo_command_error_ratio:rate3d
    expr: 1 - sum(rate(pgw_command_completion_seconds_bucket{le="60"}[3d])) / sum(rate(pgw_command_completion_seconds_count[3d]))
- name: partner-gateway-slo-alerts
  rules:
  - alert: PartnerGatewayAvailabilityBudgetBurn1h
    expr: pgw:slo_availability_error_ratio:rate1h > 0.0144 and pgw:slo_availability_error_ratio:rate5m > 0.0144
    labels:
      severity: page
      slo: availability
    annotations:
      summary: 'partner requests not failed by the gateway (non-5xx): burning error budget at over 14.4x (1h and 5m windows)'
      runbook: docs/RUNBOOK.md#availability
  - alert: PartnerGatewayAvailabilityBudgetBurn6h
    expr: pgw:slo_availability_error_ratio:rate6h > 0.006 and pgw:slo_availability_error_ratio:rate30m > 0.006
    labels:
      severity: page
      slo: availability
    annotations:
      summary: 'partner requests not failed by the gateway (non-5xx): burning error budget at over 6.0x (6h and 30m windows)'
      runbook: docs/RUNBOOK.md#availability
  - alert: PartnerGatewayAvailabilityBudgetBurn3d
    expr: pgw:slo_availability_error_ratio:rate3d > 0.001 and pgw:slo_availability_error_ratio:rate6h > 0.001
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: 'partner requests not failed by the gateway (non-5xx): burning error budget at over 1.0x (3d and 6h windows)'
      runbook: docs/RUNBOOK.md#availability
  - alert: PartnerGatewayLatencyBudgetBurn1h
    expr: pgw:slo_latency_error_ratio:rate1h > 0.144 and pgw:slo_latency_error_ratio:rate5m > 0.144
    labels:
      severity: page
      slo: latency
    annotations:
      summary: 'vehicle state reads answered within 300 ms: burning error budget at over 14.4x (1h and 5m windows)'
      runbook: docs/RUNBOOK.md#latency
  - alert: PartnerGatewayLatencyBudgetBurn6h
    expr: pgw:slo_latency_error_ratio:rate6h > 0.06 and pgw:slo_latency_error_ratio:rate30m > 0.06
    labels:
      severity: page
      slo: latency
    annotations:
      summary: 'vehicle state reads answered within 300 ms: burning error budget at over 6.0x (6h and 30m windows)'
      runbook: docs/RUNBOOK.md#latency
  - alert: PartnerGatewayLatencyBudgetBurn3d
    expr: pgw:slo_latency_error_ratio:rate3d > 0.01 and pgw:slo_latency_error_ratio:rate6h > 0.01
    labels:
      severity: ticket
      slo: latency
    annotations:
      summary: 'vehicle state reads answered within 300 ms: burning error budget at over 1.0x (3d and 6h windows)'
      runbook: docs/RUNBOOK.md#latency
  - alert: PartnerGatewayCommandBudgetBurn1h
    expr: pgw:slo_command_error_ratio:rate1h > 0.144 and pgw:slo_command_error_ratio:rate5m > 0.144
    labels:
      severity: page
      slo: command
    annotations:
      summary: 'accepted commands reaching a final state within 60 s: burning error budget at over 14.4x (1h and 5m windows)'
      runbook: docs/RUNBOOK.md#command
  - alert: PartnerGatewayCommandBudgetBurn6h
    expr: pgw:slo_command_error_ratio:rate6h > 0.06 and pgw:slo_command_error_ratio:rate30m > 0.06
    labels:
      severity: page
      slo: command
    annotations:
      summary: 'accepted commands reaching a final state within 60 s: burning error budget at over 6.0x (6h and 30m windows)'
      runbook: docs/RUNBOOK.md#command
  - alert: PartnerGatewayCommandBudgetBurn3d
    expr: pgw:slo_command_error_ratio:rate3d > 0.01 and pgw:slo_command_error_ratio:rate6h > 0.01
    labels:
      severity: ticket
      slo: command
    annotations:
      summary: 'accepted commands reaching a final state within 60 s: burning error budget at over 1.0x (3d and 6h windows)'
      runbook: docs/RUNBOOK.md#command
  - alert: PartnerGatewayCircuitOpen
    expr: max(pgw_circuit_state{name="vehicle-service"}) == 2
    for: 2m
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: circuit to the vehicle service has been open for 2 minutes
      runbook: docs/RUNBOOK.md#circuit-open
  - alert: PartnerGatewayWebhookDeadLetters
    expr: increase(pgw_webhook_deliveries_total{outcome="dead_lettered"}[15m]) > 0
    labels:
      severity: ticket
    annotations:
      summary: webhook deliveries are being dead-lettered
      runbook: docs/RUNBOOK.md#webhook-dead-letters
