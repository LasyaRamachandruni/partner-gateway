name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgw
          POSTGRES_PASSWORD: pgw
          POSTGRES_DB: pgw_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pgw" --health-interval 2s --health-retries 15
    env:
      PGW_TEST_REDIS_URL: redis://localhost:6379/0
      PGW_TEST_DATABASE_URL: postgresql+asyncpg://pgw:pgw@localhost:5432/pgw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests (Redis, Postgres, two gateway replicas)
        run: pytest -q -rs --cov --cov-report=term --cov-report=xml
      - name: Migrations match the models
        run: |
          python - <<'PY'
          import os
          from alembic import command
          from pgw.migrations_cli import config
          command.check(config(os.environ["PGW_TEST_DATABASE_URL"]))
          PY
      - name: Migrations downgrade cleanly
        run: |
          PGW_DATABASE_URL=$PGW_TEST_DATABASE_URL pgw db downgrade --revision base
          PGW_DATABASE_URL=$PGW_TEST_DATABASE_URL pgw db upgrade
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  pubsub-emulator:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
          for i in $(seq 1 60); do curl -s localhost:8085 >/dev/null && break; sleep 2; done
      - name: Bus and full system over Pub/Sub
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          set +e
          pytest -q -rA tests/test_pubsub_emulator.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^E |Error|FAILED" pytest.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            docker logs pubsub 2>&1 | tail -15 | while IFS= read -r line; do echo "::warning::emulator: $line"; done
          fi
          exit $status

  chaos:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pgw chaos --out results --repeats 1
      - name: The breaker fails fast during an outage
        run: |
          python - <<'PY'
          import json
          r = {(x["scenario"], x["config"]): x for x in json.load(open("results/chaos.json"))}
          fast = r[("outage", "retries+breaker")]["during_outage_median_ms"]
          slow = r[("outage", "none")]["during_outage_median_ms"]
          assert fast < slow / 5, (fast, slow)
          assert r[("flaky", "retries+breaker")]["success_rate"] > r[("flaky", "none")]["success_rate"] + 0.15
          print("ok", fast, slow)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: results/

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Prometheus rules are valid
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules" --entrypoint promtool prom/prometheus:v2.54.1 \
            check rules /rules/slo-rules.yml
      - name: Compose file is valid
        run: docker compose config -q
      - name: k6 script parses
        run: docker run --rm -v "$PWD/loadtest:/loadtest" grafana/k6:0.54.0 inspect /loadtest/gateway.js >/dev/null

  # The deployable topology end to end: image build, migrations, two gateway replicas sharing
  # Redis and Postgres, the vehicle service, and a short k6 run that must meet the SLO thresholds.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          docker compose up -d --build gateway-a gateway-b
          for port in 8080 8081; do
            for i in $(seq 1 60); do curl -sf "localhost:$port/readyz" && break; sleep 2; done
            curl -sf "localhost:$port/readyz" >/dev/null || { docker compose logs --tail 50; exit 1; }
          done
          docker compose ps
      - name: Register a partner
        run: |
          creds=$(docker compose run --rm -T partner 2>/dev/null | tail -1)
          echo "CLIENT_ID=$(echo "$creds" | jq -r .client_id)" >> "$GITHUB_ENV"
          echo "::add-mask::$(echo "$creds" | jq -r .client_secret)"
          echo "CLIENT_SECRET=$(echo "$creds" | jq -r .client_secret)" >> "$GITHUB_ENV"
      - name: Short load test across both replicas
        run: |
          docker compose --profile loadtest run --rm -e RATE=50 -e DURATION=20s -e WARMUP=5s \
            -e SUMMARY_PATH=/tmp/summary.json k6
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
